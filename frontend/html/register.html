<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<form class="form" onsubmit="event.preventDefault(); register();">
  <p id="heading">Sign Up</p>

  <div class="field">
    <input
      id="reg-username"
      class="input-field"
      type="text"
      placeholder="Username"
    >
  </div>

  <div class="field">
    <input
      id="reg-password"
      class="input-field"
      type="password"
      placeholder="Password"
    >
    <i class="fas fa-eye toggle-password" onclick="togglePassword('reg-password', this)"></i>
  </div>

  <div class="field">
    <input
      id="reg-confirm"
      class="input-field"
      type="password"
      placeholder="Confirm Password"
    >
    <i class="fas fa-eye toggle-password" onclick="togglePassword('reg-confirm', this)"></i>
  </div>

  <div class="btn">
    <button class="button1" type="submit">Register</button>
    <button class="button2" type="button" onclick="location.href='login.html'">
      Login
    </button>
  </div>
</form>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
