<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<form class="form" onsubmit="event.preventDefault(); login();">
  <p id="heading">Login</p>

  <div class="field">
<!--   <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
      <path d="M13.106 7.222c0-2.967-2.249-5.032-5.482-5.032-3.35 0-5.646 2.318-5.646 5.702 0 3.493 2.235 5.708 5.762 5.708"/>
    </svg> -->
    <input
      id="login-username"
      class="input-field"
      type="text"
      placeholder="Username"
      autocomplete="off"
    >
  </div>

  <div class="field">
   <!--<svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">*/
      <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2z"/>
    </svg> -->
    <input
      id="login-password"
      class="input-field"
      type="password"
      placeholder="Password"
    >
    <i class="fas fa-eye toggle-password" onclick="togglePassword('login-password', this)"></i>
  </div>

  <div class="btn">
    <button class="button1" type="submit">Login</button>
    <button class="button2" type="button" onclick="location.href='register.html'">
      Sign Up
    </button>
  </div>
</form>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
